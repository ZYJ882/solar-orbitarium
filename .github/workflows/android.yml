# 安卓自动化流水线 · 支持 tar 压缩包自动解压
# ───────────────────────────────────────────────
# 触发：push 到 main/master，或在 Actions 页面手动点 "Run workflow"
# 流程：
#   1. 若仓库根目录没有 src/ 源码，但存在 tar 包（*.tar / *.tar.gz），自动解压
#   2. npm build → cap add android → gradle assembleDebug
#   3. 编译完成后自动发布 APK 到 Releases「最新构建」页面（永久下载链接）
name: android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 自动解压项目 tar 包（如 src/ 不存在）
        run: |
          set -e
          if [ -f package.json ] && [ -d src ]; then
            echo "✅ 仓库根目录已有源码，无需解压"
            exit 0
          fi
          ARCHIVE="$(ls *.tar.gz *.tgz *.tar 2>/dev/null | head -n 1 || true)"
          if [ -z "$ARCHIVE" ]; then
            echo "❌ 仓库根目录既没有 src/ 源码，也没有找到 tar 包 (*.tar / *.tar.gz)"
            echo "   请把项目压缩包上传到仓库根目录"
            exit 1
          fi
          echo "📦 检测到压缩包：$ARCHIVE，开始解压..."
          case "$ARCHIVE" in
            *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" ;;
            *.tar)          tar -xf  "$ARCHIVE" ;;
          esac
          # 兼容解压后"多套一层文件夹"的情况：找到 package.json 所在目录并提升到根
          if [ ! -f package.json ]; then
            INNER_DIR="$(dirname "$(find . -mindepth 2 -name package.json -print -quit 2>/dev/null)" 2>/dev/null || true)"
            if [ -n "$INNER_DIR" ] && [ "$INNER_DIR" != "." ]; then
              echo "📁 解压内容位于 $INNER_DIR 子目录，移动到根目录..."
              shopt -s dotglob
              mv "$INNER_DIR"/* . 2>/dev/null || true
              rmdir "$INNER_DIR" 2>/dev/null || true
            fi
          fi
          if [ ! -f package.json ] || [ ! -d src ]; then
            echo "❌ 解压后仍未找到 package.json + src/，请确认 tar 包内容是否完整"
            exit 1
          fi
          echo "✅ 解压成功，根目录文件："
          ls -la

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理产物（按构建时间命名 APK）
        run: |
          mkdir -p out
          TS="$(date -u +%Y%m%d-%H%M)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/solar-orbitarium-${TS}.apk"

      - name: 自动发布到 Releases「最新构建」
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "最新构建 · 自动编译 APK"
          body: |
            本页面由 GitHub Actions 自动更新：每次编译成功后，最新 APK 会自动发布到这里。

            **安装方法**：下载 `solar-orbitarium-*.apk` → 点击打开 → 提示「未知来源应用」选择允许 → 安装完成。

            > 下载日期时间最新的那个文件，就是最新版本。
          files: out/*.apk
          make_latest: true
