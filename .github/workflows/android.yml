# 安卓自动化流水线
# ───────────────────────────────────────────────
# 每次 push 到 main：自动编译 debug APK，上传为 Actions 构件
# 推送 v* 标签（如 v1.0.0）：自动创建 GitHub Release，APK 挂在 Release 页面
#   git tag v1.0.0 && git push origin v1.0.0
# 下载位置：仓库页 → Releases → Assets → solar-orbitarium-<版本>.apk
name: android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare output
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/solar-orbitarium-${GITHUB_REF_NAME}.apk

      - name: Upload APK artifact (每次 push)
        uses: actions/upload-artifact@v4
        with:
          name: solar-orbitarium-${{ github.ref_name }}-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish GitHub Release (仅 v* 标签)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
