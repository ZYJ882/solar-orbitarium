name: Android Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: "v1.0.${{ github.run_number }}"
  EXPECTED_CERT_SHA256: "D2:8B:32:65:A3:8A:04:53:28:05:0E:A1:59:51:2F:67:11:11:20:1A:89:3D:77:D6:C7:3D:BF:FF:2D:32:D2:47"

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web project
        run: npm run check

      - name: Add and sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android version
        run: |
          {
            echo "android.versionCode=${VERSION_CODE}"
            echo "android.versionName=${VERSION_NAME}"
          } >> android/gradle.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks || { echo "Decoded keystore is empty"; exit 1; }
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "KEY_ALIAS is not configured"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "KEY_PASSWORD is not configured"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signing certificate
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          CERT_ENTRY="$(unzip -Z1 "$APK" | grep -E 'META-INF/[^/]+\.(RSA|DSA|EC)$' | head -n 1)"
          test -n "$CERT_ENTRY" || { echo "APK signature certificate not found"; exit 1; }
          unzip -p "$APK" "$CERT_ENTRY" > /tmp/release-cert.bin
          FINGERPRINT="$(keytool -printcert -file /tmp/release-cert.bin | awk -F': ' '/SHA256:/{print $2}')"
          echo "Certificate SHA-256: $FINGERPRINT"
          test "$FINGERPRINT" = "$EXPECTED_CERT_SHA256" || { echo "Unexpected signing certificate"; exit 1; }

      - name: Package APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/solar-orbitarium-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: "太阳系模拟器 ${{ env.VERSION_NAME }}"
          body: |
            ## 本次更新

            - 更新交互式太阳系演示与 Android 安装包。
            - 详细变更请查看本次提交记录。

            当前版本：`${{ env.VERSION_NAME }}`
          files: out/*.apk
          prerelease: false
          make_latest: true
