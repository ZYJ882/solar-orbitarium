# 安卓自动化流水线（手机新手友好版）
# ────────────────────────────────────────────────────────────
# 三种触发方式，新手用第 ① 种即可（全程在网页上点按钮）：
#   ① 手动点按钮：仓库 → Actions → android → Run workflow → 绿色按钮
#      会自动编译 APK 并创建一个「Release」，里面有永久下载链接
#   ② 推送代码到 main：自动编译，APK 存为构件（Actions 页下载，保留 90 天）
#   ③ 推送 v* 标签：自动创建 Release（进阶用法）
#
# 新手拿 APK 的最短路径：
#   上传文件 → Actions 页点 "Run workflow" → 等 5-8 分钟 → Releases 页下载
name: android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # 手动运行：网页上点按钮即可，可填版本号（默认 v1.0.0）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（将创建同名 Release）"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare output
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/solar-orbitarium-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-orbitarium-${{ github.event.inputs.version || github.ref_name }}-apk
          path: out/*.apk
          retention-days: 90

      # 手动点按钮运行 或 推送 v* 标签 时，自动创建 Release（永久下载链接）
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: 太阳系观测站 ${{ github.event.inputs.version || github.ref_name }}
          body: |
            🪐 太阳系观测站 · 交互式天文教学演示（安卓版）

            安装方法：下载 APK → 传到手机 → 点击安装
            （首次安装需允许「未知来源应用」）
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
