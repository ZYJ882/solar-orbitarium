# 安卓自动化流水线（全自动发布版）
# ─────────────────────────────────────────────────────────────
# 触发方式（二选一，都会自动把 APK 发到 Releases 下载页面）：
#   1. 推送代码到 main / master
#   2. Actions 页面手动点 "Run workflow"（手机操作推荐）
#
# 编译完成后自动创建 / 更新名为「最新构建」的 GitHub Release，
# APK 以带时间戳的文件名（如 solar-orbitarium-20260211-0930.apk）
# 永久挂在 Release 页面，随时下载安装。
# 下载位置：仓库页 → Releases → 「最新构建」 → Assets
name: android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare output（APK 按构建时间命名）
        run: |
          mkdir -p out
          TS=$(date -u +%Y%m%d-%H%M)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/solar-orbitarium-${TS}.apk"

      - name: Upload APK artifact（每次运行的临时构件，保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: solar-orbitarium-apk
          path: out/*.apk
          retention-days: 90

      - name: 自动发布到 GitHub Releases（编译完成即发布）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 · Latest Build（每次编译自动更新）"
          body: |
            🤖 本页面由自动化流水线维护：每次编译成功后，新的 APK 会自动出现在下方 **Assets** 中，文件名带构建时间（UTC），请下载时间最新的那个。

            📲 **安装方法**：点击最新的 `solar-orbitarium-*.apk` 下载 → 打开安装 → 按提示允许「未知来源应用」→ 完成。

            🔗 本次构建提交：`${{ github.sha }}`
          files: out/*.apk
          make_latest: true
