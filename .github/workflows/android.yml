# 安卓自动化流水线 · 固定的 Release 签名打包
# ─────────────────────────────────────────────────
name: android
on:
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: "v1.0.${{ github.run_number }}"
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动解压项目 tar 包（如 src/ 不存在）
        run: |
          set -e
          if [ -f package.json ] && [ -d src ]; then
            echo "✅ 仓库根目录已有源码，无需解压"
            exit 0
          fi
          ARCHIVE="$(ls *.tar.gz *.tgz *.tar 2>/dev/null | head -n 1 || true)"
          if [ -z "$ARCHIVE" ]; then
            echo "❌ 没有找到源码，请上传项目压缩包"
            exit 1
          fi
          echo "📦 检测到压缩包：$ARCHIVE"
          case "$ARCHIVE" in
            *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" ;;
            *.tar)          tar -xf  "$ARCHIVE" ;;
          esac
          if [ ! -f package.json ]; then
            INNER_DIR="$(dirname "$(find . -mindepth 2 -name package.json -print -quit)")"
            if [ -n "$INNER_DIR" ] && [ "$INNER_DIR" != "." ]; then
              shopt -s dotglob
              mv "$INNER_DIR"/* . || true
              rmdir "$INNER_DIR" || true
            fi
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: 写入固定版本号 (gradle.properties)
        run: |
          cd android
          echo "android.versionCode=${VERSION_CODE}" >> gradle.properties
          echo "android.versionName=${VERSION_NAME}" >> gradle.properties

      - name: 配置固定 Release 签名 (Inject Signing Config)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat << 'EOF' >> android/app/build.gradle
          
          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: 编译正式签名 Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/solar-orbitarium-${VERSION_NAME}.apk"

      - name: 自动发布到独立版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${VERSION_NAME}
          name: "太阳系模拟器 ${VERSION_NAME}"
          body: |
            🎉 **版本发布：${VERSION_NAME}**
            
            该安装包已使用**固定的 Release 证书签名**：
            - 支持无缝覆盖安装旧版本
            - 签名终身固定，无需卸载升级
            - 包含完整的优化与打包资源
          files: out/*.apk
          prerelease: false
          make_latest: true
