# 安卓自动化流水线 · 支持 tar 压缩包自动解压
# ─────────────────────────────────────────────────
# 触发：push 到 main/master，或在 Actions 页面手动点 "Run workflow"
# 流程：
#   1. 自动读取 Git 提交计数作为版本号
#   2. npm build → cap add android → gradle assembleDebug
#   3. 编译完成后自动发布 APK 到独立版本（可覆盖安装）
name: android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # 使用 Git 提交计数作为版本号
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: "v${{ github.run_number }}"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动解压项目 tar 包（如 src/ 不存在）
        run: |
          set -e
          if [ -f package.json ] && [ -d src ]; then
            echo "✅ 仓库根目录已有源码，无需解压"
            exit 0
          fi
          ARCHIVE="$(ls *.tar.gz *.tgz *.tar 2>/dev/null | head -n 1 || true)"
          if [ -z "$ARCHIVE" ]; then
            echo "❌ 仓库根目录既没有 src/ 源码，也没有找到 tar 包 (*.tar / *.tar.gz)"
            echo "   请把项目压缩包上传到仓库根目录"
            exit 1
          fi
          echo "📦 检测到压缩包：$ARCHIVE，开始解压..."
          case "$ARCHIVE" in
            *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" ;;
            *.tar)          tar -xf  "$ARCHIVE" ;;
          esac
          # 兼容解压后"多套一层文件夹"的情况
          if [ ! -f package.json ]; then
            INNER_DIR="$(dirname "$(find . -mindepth 2 -name package.json -print -quit 2>/dev/null)" 2>/dev/null || true)"
            if [ -n "$INNER_DIR" ] && [ "$INNER_DIR" != "." ]; then
              echo "📁 解压内容位于 $INNER_DIR 子目录，移动到根目录..."
              shopt -s dotglob
              mv "$INNER_DIR"/* . 2>/dev/null || true
              rmdir "$INNER_DIR" 2>/dev/null || true
            fi
          fi
          if [ ! -f package.json ] || [ ! -d src ]; then
            echo "❌ 解压后仍未找到 package.json + src/，请确认 tar 包内容是否完整"
            exit 1
          fi
          echo "✅ 解压成功，根目录文件："
          ls -la

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add & sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Fix gradle.properties
        run: |
          cd android
          echo "android.applicationIdSuffix=.dev" >> app/gradle.properties
          echo "android.versionCode=${VERSION_CODE}" >> app/gradle.properties
          echo "android.versionName=${VERSION_NAME}" >> app/gradle.properties
          cat app/gradle.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK with fixed version
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理产物（使用固定 APK 名称）
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/solar-orbitarium-${VERSION_NAME}.apk"

      - name: 自动发布到独立版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${VERSION_NAME}
          name: "太阳系模拟器 v1.0.${{ github.run_number }}"
          body: |
            🎉 **版本号：${VERSION_NAME}**
            
            这是自动构建的Android 安装包。
            
            **版本说明**：
            - 每次代码更新都会生成新版本（可覆盖安装）
            - 使用 Gradle 依赖自动缓存，加速构建
            
            **安装方法**：
            1. 下载 `solar-orbitarium-${VERSION_NAME}.apk`
            2. 点击打开 APK 文件
            3. 允许「未知来源应用」安装
            4. 自动安装完成
            
            **覆盖安装提示**：
            如果你安装过旧版本，建议先卸载再安装新版本，或直接覆盖安装。
          files: out/*.apk
          prerelease: true
          make_latest: true